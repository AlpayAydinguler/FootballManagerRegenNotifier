name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          To publish a release from this run, the tag to create, such as v0.2.0.
          It must match <Version> in Directory.Build.props. Leave empty for a
          plain build.
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # ContinuousIntegrationBuild turns warnings into errors. It is deliberately
      # not the local default: a first-run build that fails on analyzer noise just
      # teaches people to switch the guard off for good.
      - name: Build
        run: dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish
        run: >
          dotnet publish src/FootballManagerRegenNotifier.App/FootballManagerRegenNotifier.App.csproj
          -c Release -r win-x64 --self-contained false
          -o ${{ github.workspace }}/publish

      # The Tesseract package copies its native payload into x64/ next to the exe
      # through a targets file that only sets CopyToOutputDirectory. Publish
      # infers the rest, which works but is two layers of undocumented behaviour,
      # so assert it rather than discovering a broken release from a bug report.
      - name: Verify the native OCR payload shipped
        shell: pwsh
        run: |
          $missing = @()
          foreach ($f in 'FMRegenNotifier.exe', 'x64/tesseract50.dll', 'x64/leptonica-1.82.0.dll', 'tessdata/eng.traineddata') {
            if (-not (Test-Path "publish/$f")) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing from the publish output: $($missing -join ', ')"
            exit 1
          }
          Write-Host "All required files present."

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/* -DestinationPath artifacts/FMRegenNotifier-win-x64.zip -Force
          (Get-FileHash artifacts/FMRegenNotifier-win-x64.zip -Algorithm SHA256).Hash |
            Out-File artifacts/SHA256SUMS.txt -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: FMRegenNotifier-win-x64
          path: artifacts/
          retention-days: 14

  release:
    needs: build
    # A pushed v* tag, or a manual run given the tag to create. The second is
    # for cutting a release from somewhere that may not push tags.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # Only for the hand-written notes in docs/releases/; the binaries come from
      # the build job, so what ships is exactly what was tested.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FMRegenNotifier-win-x64
          path: artifacts

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # A pushed tag names itself. A manual run names the tag to create, and
          # gh creates it on the commit this run built and tested.
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "$env:RELEASE_TAG".Trim() }

          # The tag has to say what the binaries say they are.
          [xml]$props = Get-Content Directory.Build.props
          $version = 'v' + ($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($tag -ne $version) {
            Write-Error "Tag '$tag' does not match <Version> in Directory.Build.props ('$version')."
            exit 1
          }

          # PowerShell does not glob for native executables, so expand the paths
          # before handing them to gh.
          $files = (Get-ChildItem artifacts -File).FullName

          # A generated list of commits says what changed, not what it means for
          # someone upgrading. When docs/releases/<tag>.md exists, gh puts it
          # above the generated list.
          $notes = @()
          $notesFile = "docs/releases/$tag.md"
          if (Test-Path $notesFile) { $notes = @('--notes-file', $notesFile) }

          # --target only matters when the tag does not exist yet.
          gh release create $tag @files @notes --target $env:GITHUB_SHA --generate-notes --repo $env:GITHUB_REPOSITORY
